services:

  db:
    image: mariadb:${MARIADB_VERSION:-10.11}
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE:      ${MYSQL_DATABASE:-mediawiki}
      MYSQL_USER:          ${MYSQL_USER:-mediawiki}
      MYSQL_PASSWORD:      ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  mediawiki:
    image: mediawiki:${MEDIAWIKI_VERSION:-1.42}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      # Persistent wiki data (images, uploaded files)
      - mw_images:/var/www/html/images
      # Extensions volume — managed by update-extensions.sh
      - mw_extensions:/var/www/html/extensions
      # Skins volume — custom skins restored from backup
      - mw_skins:/var/www/html/skins
      # Tmp volume — required by MediaWiki ($wgTmpDirectory)
      - mw_tmp:/var/www/html/tmp
      # LocalSettings.php — mount yours here after initial setup
      # The extension update script available inside the container
      - ./docker/update-extensions-skins.sh:/var/www/html/update-extensions-skins.sh:ro
      - ./docker/skin-updates.txt:/var/www/html/skin-updates.txt
      # Config and extension list accessible by the update script
      - ./.env:/var/www/html/.env:ro
      - ./docker/extension-updates.txt:/var/www/html/extension-updates.txt
      - ./docker/extension-updates.txt.example:/var/www/html/extension-updates.txt.example:ro
    environment:
      MEDIAWIKI_DB_HOST:     db
      MEDIAWIKI_DB_NAME:     ${MYSQL_DATABASE:-mediawiki}
      MEDIAWIKI_DB_USER:     ${MYSQL_USER:-mediawiki}
      MEDIAWIKI_DB_PASSWORD: ${MYSQL_PASSWORD}

volumes:
  db_data:
  mw_images:
  mw_extensions:
  mw_skins:
  mw_tmp:
